name: Build

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Test screen geometry
        run: bash scripts/test-screen-geometry.sh

      - name: Test link filter
        run: bash scripts/test-safe-links.sh

      - name: Test auto-close timing
        run: bash scripts/test-auto-close.sh

      - name: Test Claude response text
        run: bash scripts/test-claude-response.sh

      - name: Claude settings file tests
        run: bash scripts/test-claude-settings.sh

      - name: Build
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package the macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Release/Roadeep.app Roadeep-macOS.zip

      - name: Upload the macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Roadeep-macOS
          path: Roadeep-macOS.zip
